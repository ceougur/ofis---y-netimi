name: Sürüm yayımla

# "v1.3.1" gibi bir etiket gönderildiğinde: testler → Windows kurulum dosyası (gerçek Windows'ta kurulum testiyle)
# → imzalı güncelleme paketi → GitHub Release. Kurulumlar sunucu açılışında bu yayını bulup kendiliğinden güncellenir.
# Gerekli gizli değişken: DESTEKOFIS_RELEASE_KEY (Ed25519 gizli anahtar, PEM). Etiket "-beta" gibi bir ek içeriyorsa
# yayın "ön sürüm" olarak işaretlenir ve yalnızca deneme (beta) kanalındaki kurulumlara gider.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Doğrulama kapısı CI koşularını okur (tools/kanit.mjs ci).
  actions: read

jobs:
  test:
    name: Testler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Etiketler: eski sürümlerin GERÇEK koduyla veri üreten testler (npm test'teki göç testleri, senaryo-banka-210-temel adım 10 v2.0.23).
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Etiket ile package.json sürümü aynı mı?
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Etiket $GITHUB_REF_NAME, package.json $version"; exit 1; }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:senaryo-219
      - run: npm run test:senaryo-220
      - run: npm run test:senaryo-220-yedek
      - run: npm run test:senaryo-221
      - run: npm run test:senaryo-222
      - run: npm run test:senaryo-223
      - run: npm run test:senaryo-224
      - run: npm run test:senaryo-225
      - run: npm run test:senaryo-225-uyari
      - run: npm run test:senaryo-226
      - run: npm run test:senaryo-iz1-sayfa
      - run: npm run test:senaryo-iz1-kasa-acilis
      - run: npm run test:senaryo-banka-210
      - run: npm run test:senaryo-banka-210b
      - run: npm run test:senaryo-banka-210-temel
      - run: npm run test:senaryo-banka-210-eski-satir
      - run: npm run test:senaryo-banka-220
      - run: npm run test:senaryo-pos-220
      - run: npm run test:senaryo-tahsile-ver-220
      - run: npm run test:senaryo-k8-230
      - run: npm run test:senaryo-iz32-230
      - run: npm run test:senaryo-supheli-230
      - run: npm run test:senaryo-iz5-230
      - run: npm run test:senaryo-entegrator-240
      - run: npm run test:senaryo-ebelge-242
      - run: npm run test:senaryo-ebelge-243
      - run: npm run test:senaryo-form-izolasyon-243
      - run: npm run test:senaryo-fatura-243
      - run: npm run test:senaryo-cari-243
      - run: npm run test:senaryo-personel-244
      - run: npm run test:senaryo-portal-244
      - run: npm run test:senaryo-kayit-tahsilat-244
      - run: npm run test:senaryo-cari-vade-245
      - run: npm run test:senaryo-kayit-bag-31e
      - run: npm run test:senaryo-pil-karti-245
      - run: npm run test:senaryo-serit-sira-245
      - run: npm run test:senaryo-ekstre-ayrinti-245
      - run: npm run test:senaryo-netten-brute-244
      - run: npm run test:senaryo-ux18-244
      - run: npm run test:senaryo-banka-rapor-243
      - run: npm run test:senaryo-defter-243
      - run: npm run test:banka-230-hareket-yaris
      - run: npm run test:banka-210-saat
      - run: npm run test:banka-210-kart-onbellek
      - run: npm run test:banka-210-daha-fazla
      - run: npm run test:acilis-yanit-yaris
      - run: npm run test:banka-210-ekran-aciklama
      - run: npm run test:guncelleme-gercek
      - run: npm run test:hiz-243-arka-plan
      - run: npm run test:fatura-243-daha-fazla-yaris
      - run: npm run test:fatura-243-duzen-kaymasi
      - run: npm run test:gg243-arka-plan-yazma
      - run: npm run test:gg243-odak-dugme
      - run: npm run test:gg243-kopyala
      - run: npm run test:gg243-odak-kalem-sil
      - run: npm run test:gg243-tumunu-gonder
      - run: npm run test:gg244-secilenleri-gonder
      - run: npm run test:gg244-esmm-gonder
      - run: npm run test:gg244-numara-tarih-onay
      - run: npm run test:gg243-odak-silme-diger
      - run: npm run test:gg243-banka-kart-aciklama
      - run: npm run test:gg243-dar2-ekran
      - run: npm run test:uiux-a-243
      - run: npm run test:uiux-b-243
      - run: npm run test:uiux-244-ux9-ux10
      - run: npm run test:uiux-ui11-244
      - run: npm run test:sirket-canli-yetki-244
      - run: npm run test:baslarken-244

  windows:
    name: Windows kurulum paketi
    needs: test
    uses: ./.github/workflows/windows.yml

  publish:
    name: Yayımla
    needs: windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: destekofis-kurulum
          path: dist
      # Doğrulama kapısı (10.10.2026): etiketlenen commit'in CI'si (Linux + Windows × Node 22/24, uçtan uca, "Doğrulama Kapısı")
      # YEŞİL değilse yayın yok. CI hâlâ sürüyorsa en çok 90 dk beklenir.
      - name: Doğrulama kapısı (CI yeşil mi?)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/kanit.mjs ci "$GITHUB_SHA" --bekle 90
      # Yayın web arayüzünden elle açıldıysa (etiket orada oluşturulduysa) eksik dosyalar eklenir: Windows'ta sınanmış
      # kurulum dosyası (sürümlü ve sitenin indirdiği sürümsüz adla), kullanım kılavuzu ve — DESTEKOFIS_RELEASE_KEY
      # tanımlıysa ve yayında yoksa — imzalı güncelleme paketi. Yayında zaten olan dosyalara dokunulmaz.
      - name: Yayımla
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DESTEKOFIS_RELEASE_KEY: ${{ secrets.DESTEKOFIS_RELEASE_KEY }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          channel=stable
          flags=""
          case "$tag" in *-*) channel=beta; flags="--prerelease" ;; esac
          cp "dist/DestekOfis-Kurulum-$version.exe" dist/DestekOfis-Kurulum.exe
          cp client/kilavuz/DestekOfis-Kullanim-Kilavuzu.pdf dist/DestekOfis-Kullanim-Kilavuzu.pdf
          signed=""
          if [ -n "$DESTEKOFIS_RELEASE_KEY" ]; then
            node tools/release.mjs --kanal "$channel" --cikti dist/guncelleme
            signed="dist/guncelleme/destekofis-guncelleme-$version.zip dist/guncelleme/destekofis-guncelleme.json dist/guncelleme/SHA256SUMS"
          else
            echo "::warning::DESTEKOFIS_RELEASE_KEY gizli değişkeni tanımlı değil; imzalı güncelleme paketi eklenemedi. Kurulumlar bu sürüme kendiliğinden geçmez."
          fi
          files="dist/DestekOfis-Kurulum-$version.exe dist/DestekOfis-Kurulum-$version.exe.sha256 dist/DestekOfis-Kurulum.exe dist/DestekOfis-Kullanim-Kilavuzu.pdf $signed"
          if gh release view "$tag" >/dev/null 2>&1; then
            existing="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            # Bildirge ve paketi birlikte ele alınır: yalnızca biri varsa (elle yüklenmiş) ikisine de dokunulmaz.
            if printf '%s\n' "$existing" | grep -qx 'destekofis-guncelleme.json\|destekofis-guncelleme-.*\.zip'; then signed_present=1; else signed_present=0; fi
            for file in $files; do
              name="$(basename "$file")"
              case "$name" in destekofis-guncelleme*|SHA256SUMS) [ "$signed_present" = 1 ] && { echo "Güncelleme paketi zaten var, dokunulmadı: $name"; continue; } ;; esac
              if printf '%s\n' "$existing" | grep -qxF "$name"; then echo "Zaten var: $name"; else gh release upload "$tag" "$file"; fi
            done
            exit 0
          fi
          test -n "$signed" || { echo "::error::DESTEKOFIS_RELEASE_KEY gizli değişkeni tanımlı değil; imzalı güncelleme paketi olmadan yeni yayın açılmaz."; exit 1; }
          gh release create "$tag" $flags \
            --title "DestekOfis $version" \
            --notes-file dist/guncelleme/SURUM-NOTLARI.md \
            $files
